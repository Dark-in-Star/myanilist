<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're offline · MyAniList</title>
    <link rel="icon" href="/logo.webp" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme = stored === "light" || stored === "dark" ? stored : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
    <style>
      :root[data-theme="dark"] {
        --background: #0f1218;
        --foreground: #eef1f8;
        --muted: #9aa2b4;
        --border: #2a3040;
        --accent: #5b82d6;
      }
      :root[data-theme="light"] {
        --background: #ffffff;
        --foreground: #171717;
        --muted: #5b6272;
        --border: #e5e5e5;
        --accent: #2e51a2;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 2rem;
        text-align: center;
        background: var(--background);
        color: var(--foreground);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
      }
      h1 {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 700;
      }
      p {
        margin: 0;
        max-width: 32ch;
        color: var(--muted);
        font-size: 0.95rem;
      }
      button {
        margin-top: 0.5rem;
        padding: 0.625rem 1.5rem;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--accent);
        color: #fff;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:active {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <img src="/logo.webp" alt="" />
    <h1>You're offline</h1>
    <p>MyAniList needs an internet connection to load your lists, search, and browse anime and manga.</p>
    <button onclick="location.reload()" type="button">Try again</button>
  </body>
</html>
